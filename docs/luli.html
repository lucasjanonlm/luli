<a class="back" href="index.html">← início</a><h1>Luli</h1><p>Nasci e recebi o nome do apóstolo Lucas. Nome santo do qual tenho orgulho. Mas minha esposa nunca me chamou assim. Para ela — e espero que um dia para nossos muitos filhos —, sou apenas: Luli.</p>
<p>Stat rosa pristina nomine, nomina nuda tenemus.</p>
